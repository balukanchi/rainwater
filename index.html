<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yoga Student Records</title>

    <meta name="description" content="View student yoga records, school details, organizers and issue dates.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6f9;
            color: #263238;
        }

        .header {
            background: #176b45;
            color: white;
            text-align: center;
            padding: 28px 15px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .header p {
            margin: 0;
            font-size: 15px;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .section-title {
            margin: 0 0 20px;
            color: #176b45;
            font-size: 22px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 15px;
        }

        .record-count {
            font-weight: bold;
            font-size: 15px;
        }

        #count {
            color: #176b45;
        }

        #retry {
            border: none;
            border-radius: 5px;
            padding: 10px 18px;
            background: #176b45;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        #retry:hover {
            background: #105435;
        }

        #retry:focus-visible {
            outline: 3px solid #8bd8ae;
            outline-offset: 2px;
        }

        #status {
            margin: 10px 0 15px;
            padding: 12px;
            background: #eef7f1;
            border-left: 4px solid #176b45;
            border-radius: 4px;
            overflow-wrap: anywhere;
            font-size: 14px;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        thead {
            background: #176b45;
            color: white;
        }

        th,
        td {
            padding: 13px 12px;
            text-align: left;
            border: 1px solid #dce5df;
            font-size: 14px;
        }

        th {
            font-weight: bold;
            white-space: nowrap;
        }

        tbody tr:nth-child(even) {
            background: #f5faf7;
        }

        tbody tr:hover {
            background: #e7f4eb;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #555;
        }

        footer {
            text-align: center;
            padding: 20px 10px;
            background: #e7eee9;
            color: #526158;
            font-size: 13px;
            margin-top: 35px;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 23px;
            }

            .container {
                width: 96%;
                padding: 15px;
                margin: 15px auto;
            }

            .section-title {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>Yoga Student Records</h1>
        <p>Student Details and Certificate Issue Information</p>
    </header>

    <main class="container">

        <h2 class="section-title">Student Yoga Details</h2>

        <div class="toolbar">
            <div class="record-count">
                Total Records: <span id="count">—</span>
            </div>

            <button id="retry" type="button" hidden>
                Retry Loading
            </button>
        </div>

        <p id="status" role="status" aria-live="polite">
            Connecting to Supabase...
        </p>

        <div class="table-wrapper">
            <table id="students" aria-busy="true">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Created At</th>
                        <th>Student Name</th>
                        <th>School Name</th>
                        <th>Organizer</th>
                        <th>Issue Date</th>
                    </tr>
                </thead>

                <tbody id="records">
                    <tr>
                        <td colspan="6" class="empty">
                            Loading student records...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

    <footer>
        Yoga Student Records Portal
    </footer>

    <!-- Load configuration before the JavaScript application -->
    <script src="./config.js"></script>
    <script src="./app.js"></script>

</body>
</html>
